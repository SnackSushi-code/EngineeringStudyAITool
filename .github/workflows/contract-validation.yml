name: Contract Validation

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main
      - "phase-*"

permissions:
  contents: read

jobs:
  contract-validation:
    name: Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install contract validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jsonschema==4.26.0" \
            "referencing==0.37.0"

      - name: Validate JSON schemas
        run: |
          python tests/contract/validate_schemas.py

      - name: Run contract tests
        run: |
          python -m unittest discover \
            -s tests/contract \
            -p "test_*.py" \
            -v

      - name: Check Git whitespace
        run: |
          git diff --check
