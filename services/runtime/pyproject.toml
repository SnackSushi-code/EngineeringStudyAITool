[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-e-runtime"
version = "0.4.4"
description = "Ann-E controlled runtime adapter execution boundary"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
