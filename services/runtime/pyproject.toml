[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-e-runtime"
version = "0.4.2"
description = "Ann-E runtime orchestration foundation"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[tool.setuptools.packages.find]
where = ["src"]
